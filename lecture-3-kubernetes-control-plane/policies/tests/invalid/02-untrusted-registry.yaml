apiVersion: v1
kind: Pod
metadata:
  name: reject-untrusted-registry
  namespace: policy-tests
  labels:
    app.kubernetes.io/name: policy-test
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/managed-by: raw-manifest
spec:
  hostNetwork: false
  hostPID: false
  hostIPC: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 65532

  containers:
    - name: test
      image: docker.io/library/busybox:1.36
      command:
        - sleep
        - "3600"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
