apiVersion: v1
kind: Pod
metadata:
  name: reject-no-resources
  namespace: policy-tests
  labels:
    app.kubernetes.io/name: policy-test
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/managed-by: raw-manifest
spec:
  hostNetwork: false
  hostPID: false
  hostIPC: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 65532

  containers:
    - name: test
      image: registry.k8s.io/pause:3.10
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false

      # resources intentionally omitted: this Pod must be rejected.
