apiVersion: v1
kind: Pod
metadata:
  name: reject-missing-labels
  namespace: policy-tests
  # labels intentionally omitted: this Pod must be rejected.
spec:
  hostNetwork: false
  hostPID: false
  hostIPC: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 65532

  containers:
    - name: test
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
