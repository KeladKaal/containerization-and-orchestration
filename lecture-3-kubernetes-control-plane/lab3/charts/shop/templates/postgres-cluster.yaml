apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "shop.fullname" . }}-postgres
  labels:
    {{- include "shop.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  instances: {{ .Values.postgres.instances }}

  inheritedMetadata:
    labels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: shop
      app.kubernetes.io/managed-by: cloudnative-pg

  bootstrap:
    initdb:
      database: {{ .Values.postgres.database | quote }}
      owner: {{ .Values.postgres.owner | quote }}
      secret:
        name: {{ include "shop.fullname" . }}-postgres-credentials

  storage:
    size: {{ .Values.postgres.storage.size | quote }}
    storageClass: {{ .Values.postgres.storage.storageClass | quote }}

  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
