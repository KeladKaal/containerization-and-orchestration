apiVersion: v1
kind: Service
metadata:
  name: {{ include "shop.fullname" . }}-worker
  labels:
    {{- include "shop.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: worker
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.worker.service.type }}
  selector:
    app.kubernetes.io/name: worker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.worker.service.port }}
      targetPort: http
      protocol: TCP
