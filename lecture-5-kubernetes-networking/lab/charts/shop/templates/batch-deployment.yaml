{{- if .Values.batch.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-batch
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: batch
    app.kubernetes.io/part-of: shop
    owner: {{ .Values.owner }}
spec:
  replicas: {{ .Values.batch.replicaCount }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: batch
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: batch
        app.kubernetes.io/part-of: shop
        owner: {{ .Values.owner }}
    spec:
      {{- if .Values.batch.priorityClassName }}
      priorityClassName: {{ .Values.batch.priorityClassName }}
      {{- end }}
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: batch
          image: "{{ .Values.image.registry }}/batch:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.batch.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.batch.containerPort | quote }}
            - name: BATCH_CPU_WORKERS
              value: {{ .Values.batch.load.cpuWorkers | quote }}
            - name: BATCH_MEMORY_MIB
              value: {{ .Values.batch.load.memoryMiB | quote }}
            - name: BATCH_MEMORY_STEP_MIB
              value: {{ .Values.batch.load.memoryStepMiB | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.batch.resources | nindent 12 }}
{{- end }}
