owner: egor

image:
  registry: registry.local/shop
  tag: "0.1.1"
  pullPolicy: IfNotPresent

spread:
  mechanism: topologySpreadConstraints
  topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    maxSkew: 1
    whenUnsatisfiable: DoNotSchedule
  podAntiAffinity:
    weight: 100

priorityClasses:
  critical:
    name: shop-critical
    value: 1000000
    preemptionPolicy: PreemptLowerPriority
    description: >-
      Критический путь заказа (api, postgres). Может вытеснять поды с меньшим
      приоритетом, когда в кластере не хватает места.
  batch:
    name: shop-batch
    value: -100
    preemptionPolicy: Never
    description: >-
      Фоновая аналитика. Никого не вытесняет и первой уступает место.

api:
  replicaCount: 3
  containerPort: 8080
  service:
    port: 80
    type: NodePort
    nodePort: 30080
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  progressDeadlineSeconds: 120
  revisionHistoryLimit: 5
  healthFail: false
  preStopSeconds: 5
  priorityClassName: shop-critical
  pdb:
    enabled: true
    minAvailable: 2
  # requests = limits, несмотря на рекомендации KRR (critical).
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 100m
      memory: 100Mi

worker:
  replicaCount: 2
  containerPort: 8080
  service:
    port: 80
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  progressDeadlineSeconds: 120
  revisionHistoryLimit: 5
  healthFail: false
  priorityClassName: ""
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi

batch:
  enabled: false
  replicaCount: 2
  containerPort: 8080
  priorityClassName: shop-batch
  load:
    cpuWorkers: 1
    memoryMiB: 64
    memoryStepMiB: 16
  # Burstable: requests сильно ниже limits (не смотря на рекомендации KRR)
  resources:
    requests:
      cpu: 250m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 768Mi

postgres:
  enabled: true
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  database: shop
  username: shop
  storage:
    size: 1Gi
    storageClass: standard
  priorityClassName: shop-critical
  pdb:
    enabled: true
    minAvailable: 1
  # request = limits, так как critical.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi

monitoring:
  enabled: true
  serviceMonitor:
    interval: 15s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: true
  sla:
    orderP95Seconds: 0.3
  network:
    policyDropsPerSecond: 0.1
    tcpResetRatio: 0.5
  dashboard:
    enabled: true

networkPolicy:
  enabled: true
  clientCIDR: 0.0.0.0/0
  monitoringNamespace: monitoring
  cnpgNamespace: cnpg-system
  apiServerPorts:
    - 443
    - 6443
