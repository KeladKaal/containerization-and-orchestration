apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: cnpg-bootstrap-jobs
  namespace: kyverno
spec:
  exceptions:
    - policyName: require-workload-labels
      ruleNames:
        - check-required-labels
        - autogen-check-required-labels
        - autogen-cronjob-check-required-labels
  match:
    any:
      - resources:
          kinds:
            - Pod
            - Job
          namespaces:
            - lab-4
          selector:
            matchExpressions:
              - key: cnpg.io/jobRole
                operator: Exists
