# Лаба 5: 1 control-plane + 2 воркера, без дефолтного CNI (ставим Cilium сами).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shop
networking:
  disableDefaultCNI: true
nodes:
  - role: control-plane
  - role: worker
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
  - role: worker
