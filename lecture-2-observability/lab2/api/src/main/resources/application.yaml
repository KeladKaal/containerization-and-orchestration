spring:
  application:
    name: api

server:
  port: 8080
  shutdown: graceful

app:
  # в кластере переопределяется на http://api:8080, чтобы /load шёл через Service на все реплики
  self-base-url: ${APP_SELF_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    distribution:
      # без бакетов histogram_quantile для p95 посчитать нечем
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s
  tracing:
    sampling:
      # лаба: нужен каждый трейс; в проде тут 0.01-0.1 + tail-based sampling
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  level:
    root: INFO
    ru.itmo.obs.api: INFO
