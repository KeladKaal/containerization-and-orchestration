{{- if .Values.sink.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  labels:
    app.kubernetes.io/name: alert-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-sink
    spec:
      containers:
        - name: sink
          image: "{{ .Values.sink.image.repository }}:{{ .Values.sink.image.tag }}"
          imagePullPolicy: {{ .Values.sink.image.pullPolicy }}
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: LOG_WITHOUT_NEWLINE
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.sink.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  labels:
    app.kubernetes.io/name: alert-sink
spec:
  selector:
    app.kubernetes.io/name: alert-sink
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
