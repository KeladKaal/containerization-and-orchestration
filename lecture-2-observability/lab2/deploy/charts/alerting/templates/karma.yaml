apiVersion: v1
kind: ConfigMap
metadata:
  name: karma
  labels:
    app.kubernetes.io/name: karma
data:
  karma.yaml: |
    alertmanager:
      interval: 15s
      servers:
        - name: kps
          uri: {{ .Values.karma.alertmanagerUri }}
          timeout: 10s
          proxy: true
    karma:
      name: lab2
    ui:
      refresh: 10s
      multiGridLabel: severity
      collapseGroups: collapsedOnMobile
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karma
  labels:
    app.kubernetes.io/name: karma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: karma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karma
      annotations:
        checksum/config: {{ .Values.karma.alertmanagerUri | sha256sum }}
    spec:
      containers:
        - name: karma
          image: "{{ .Values.karma.image.repository }}:{{ .Values.karma.image.tag }}"
          imagePullPolicy: {{ .Values.karma.image.pullPolicy }}
          env:
            - name: CONFIG_FILE
              value: /etc/karma/karma.yaml
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/karma
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.karma.resources | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: karma
---
apiVersion: v1
kind: Service
metadata:
  name: karma
  labels:
    app.kubernetes.io/name: karma
spec:
  selector:
    app.kubernetes.io/name: karma
  ports:
    - name: http
      port: 8080
      targetPort: http
