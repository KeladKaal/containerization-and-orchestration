replicaCount: 2

image:
  repository: lab2/api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 8080

otlp:
  endpoint: http://jaeger-collector.obs.svc.cluster.local:4318

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi

serviceMonitor:
  enabled: true
  interval: 15s
  path: /actuator/prometheus

alerts:
  enabled: true
  errorRatio: 0.05
  errorRatioFor: 2m
  latencyP95Seconds: 1.5
  latencyFor: 5m
  downFor: 1m

dashboard:
  enabled: true
