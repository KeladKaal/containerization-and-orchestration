jaeger:
  enabled: true

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8888"

  ingress:
    enabled: false 

userconfig:
  service:
    extensions: [jaeger_storage, jaeger_query, healthcheckv2]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [jaeger_storage_exporter]
    telemetry:
      resource:
        service.name: jaeger
      metrics:
        level: detailed
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888

  extensions:
    healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133

    jaeger_storage:
      backends:
        mem:
          memory:
            max_traces: 10000   # потолок, чтобы под не упёрся в memory limit

    jaeger_query:
      storage:
        traces: mem

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317   
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}

  exporters:
    jaeger_storage_exporter:
      trace_storage: mem

spark:
  enabled: false
esIndexCleaner:
  enabled: false
esRollover:
  enabled: false
esLookback:
  enabled: false